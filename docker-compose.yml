services:
  streamrecorder:
    build: .
    container_name: streamrecorder

    # post-recording processing runs after the stop signal and is bounded at 5m, so give the
    # container long enough to finish it instead of being killed after Compose's default 10s
    stop_grace_period: 6m

    ports:
    - 8080:8080

    volumes:
    - ./records:/records

    environment:
      - PORT=8080
      - DIR=/records
      #- DBG=true
      - TZ=UTC
      - SCHEDULE=true
      #- RETENTION_DAYS=30
      #- NEWS_API=https://news.radio-t.com/api/v1
      #- AUTH_PASSWD=$$2y$$10$$... # bcrypt hash for POST /record auth (use $$ to escape $ in compose)
